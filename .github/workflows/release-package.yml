name: Release package

on:
  release:
    types: [published]

permissions:
  contents: write
  actions: read

jobs:
  verify-autotests:
    name: Verify Autotests passed for release commit
    runs-on: ubuntu-latest

    steps:
      - name: Find successful Autotests run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_url="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/autotests.yml/runs" \
            -f head_sha="${GITHUB_SHA}" -f event=push -f status=success \
            --jq '.workflow_runs[0].html_url // empty')"
          if [[ -z "$run_url" ]]; then
            echo "No successful Autotests push run found for release commit ${GITHUB_SHA}."
            exit 1
          fi
          echo "Successful Autotests run: $run_url"

  cran-check:
    name: CRAN check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Check package as CRAN
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          upload-results: always

  build-and-upload:
    name: Build and attach package source
    needs: [verify-autotests, cran-check]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Verify release tag matches DESCRIPTION
        shell: bash
        run: |
          version="$(Rscript -e 'cat(read.dcf("DESCRIPTION")[1, "Version"])')"
          expected_tag="v${version}"
          if [[ "${{ github.event.release.tag_name }}" != "$expected_tag" ]]; then
            echo "Release tag must be $expected_tag for DESCRIPTION version $version."
            exit 1
          fi

      - name: Build source package
        shell: bash
        run: |
          R CMD build .
          version="$(Rscript -e 'cat(read.dcf("DESCRIPTION")[1, "Version"])')"
          tarball="DynMSR_${version}.tar.gz"
          test -f "$tarball"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: Attach source package to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$TARBALL" --clobber

      # Future CRAN submission flow:
      #
      # 1. Upload "$TARBALL" through a documented CRAN submission API, after
      #    verifying that the release is not a draft.
      # 2. Save the response from the submission service as a workflow artifact
      #    so that the maintainer can trace the submission.
      # 3. CRAN sends the confirmation link to the Maintainer email in
      #    DESCRIPTION. The maintainer confirms the submission manually.
      #
      # - name: Upload package to CRAN
      #   if: github.event.release.draft == false
      #   run: <submission upload command>
